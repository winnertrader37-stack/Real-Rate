<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Madaallii Bifa Nama</title>
<style>
:root{--bg:#faf8ff;--card:#fff;--tx:#1d1b26;--mut:#6b6880;--ac:#7c4dff;--ac2:#ff4d8d;--bd:#e4e0f0;--ok:#1aa36a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121c;--card:#1e1b2a;--tx:#f1eefb;--mut:#a29fb8;--bd:#332f45}}
:root[data-theme="dark"]{--bg:#14121c;--card:#1e1b2a;--tx:#f1eefb;--mut:#a29fb8;--bd:#332f45}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 4px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:1rem;margin:0 0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:8px;border:1.5px solid var(--bd);border-radius:12px;padding:10px;cursor:pointer;user-select:none}
.opt input{accent-color:var(--ac);width:18px;height:18px;margin:0}
.opt.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,transparent)}
.drop{display:block;border:2px dashed var(--bd);border-radius:14px;text-align:center;padding:20px;cursor:pointer;color:var(--mut)}
.drop img{max-width:100%;max-height:320px;border-radius:12px;display:block;margin:0 auto}
button{width:100%;border:0;border-radius:14px;padding:14px;font-size:1rem;font-weight:600;color:#fff;background:linear-gradient(90deg,var(--ac),var(--ac2));cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;color:var(--mut);margin-bottom:8px}
.chk input{margin-top:3px;accent-color:var(--ac)}
.overall{text-align:center}
.big{font-size:3rem;font-weight:800;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.row{margin:14px 0}
.row .h{display:flex;justify-content:space-between;font-weight:600}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:6px}
.row p{margin:2px 0;color:var(--mut);font-size:.92rem}
.note{font-size:.8rem;color:var(--mut);text-align:center;margin-top:8px}
.err{color:#d33;margin:8px 0;font-size:.92rem}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Madaallii Bifa Nama</h1>
<p class="sub">Fuula qofa osoo hin taane, qaama, uffata, ija fi ilkaan illee filannoon madaalaa.</p>

<div class="card">
  <h2>1. Suuraa kee ol-fe’i</h2>
  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/*" hidden>
    <span id="dropTxt">📷 Suuraa filadhu yookaan kaameraan kaasi</span>
    <img id="prev" class="hide" alt="">
  </label>
  <p class="note">Suuraan kee kuufamu hin qabu; madaallii qofaaf ergama. · v2</p>
</div>

<div class="card">
  <h2>2. Maal madaalamu?</h2>
  <div class="opts" id="opts"></div>
  <div class="chk" style="margin-top:10px"><input type="checkbox" id="rateClothes"><label for="rateClothes">Uffata uffatte irratti akkamitti bareedina fi qabxii (rate) kenni</label></div>
</div>

<div class="card">
  <div class="chk"><input type="checkbox" id="adult"><label for="adult">Ani umurii waggaa 18 ol dha, suuraan kun kan kootii dha yookaan eeyyama nama suuraa isaa ti.</label></div>
  <div class="chk"><input type="checkbox" id="fun"><label for="fun">Madaalliin kun yaada AI qofa; ilaalcha dhuunfaa ti malee dhugaa guutuu miti. Gatii koo hin murteessu.</label></div>
  <div id="err" class="err hide"></div>
  <button id="go" disabled>Madaali</button>
</div>

<div id="res" class="card hide"></div>
</main>

<script>
(function(){
// Worker URL kee asitti galchi (Cloudflare irraa argatta)
var API_URL="https://YOUR-WORKER.YOUR-NAME.workers.dev";
var CATS=[
 {id:"face",l:"Fuula",ic:"🙂",d:"fuula waliigala, wal-madaaluu fi fakkeenya"},
 {id:"body",l:"Bifa qaamaa",ic:"🧍",d:"bifa fi madaalli qaamaa (kabaja waliin, mudaa hin dubbatin)"},
 {id:"outfit",l:"Uffata",ic:"👕",d:"uffanni nama sanaaf akka madaqu"},
 {id:"eyes",l:"Bareedina ija",ic:"👁️",d:"bifa, ibsaa fi mul’ata ija"},
 {id:"teeth",l:"Ilkaan",ic:"😁",d:"bifa ilkaanii fi qulqullina kolfaa"},
 {id:"hair",l:"Rifeensa",ic:"💇",d:"akkaataa fi bifa rifeensaa"},
 {id:"skin",l:"Gogaa",ic:"✨",d:"bifa gogaa fi ibsaa"},
 {id:"style",l:"Akkaataa waliigalaa",ic:"😎",d:"mul’ata waliigalaa fi amaanaa"}
];
var $=function(i){return document.getElementById(i)};
var optsEl=$("opts");
CATS.forEach(function(c){
  var lab=document.createElement("label");lab.className="opt on";
  var cb=document.createElement("input");cb.type="checkbox";cb.checked=true;cb.value=c.id;
  var sp=document.createElement("span");sp.textContent=c.ic+" "+c.l;
  lab.appendChild(cb);lab.appendChild(sp);optsEl.appendChild(lab);
  cb.addEventListener("change",function(){lab.classList.toggle("on",cb.checked);upd()});
});
var blob=null;
function upd(){
  var any=optsEl.querySelectorAll("input:checked").length>0;
  $("go").disabled=!(blob&&any&&$("adult").checked&&$("fun").checked);
}
$("adult").onchange=upd;$("fun").onchange=upd;
function showErr(m){var e=$("err");e.textContent=m||"";e.classList.toggle("hide",!m)}

$("file").addEventListener("change",function(ev){
  var f=ev.target.files&&ev.target.files[0];if(!f)return;
  var img=new Image();var url=URL.createObjectURL(f);
  img.onload=function(){
    var M=1024,w=img.width,h=img.height,s=Math.min(1,M/Math.max(w,h));
    var cv=document.createElement("canvas");cv.width=Math.round(w*s);cv.height=Math.round(h*s);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(function(b){
      blob=b;var p=$("prev");p.src=cv.toDataURL("image/jpeg",.8);p.classList.remove("hide");
      $("dropTxt").textContent="Suuraa jijjiiruuf tuqi";URL.revokeObjectURL(url);upd();
    },"image/jpeg",.85);
  };
  img.onerror=function(){showErr("Suuraan kun hin banamne.")};
  img.src=url;
});

function esc(t){var d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML}

$("go").addEventListener("click",async function(){
  showErr("");
  var ids=[].map.call(optsEl.querySelectorAll("input:checked"),function(x){return x.value});
  var sel=CATS.filter(function(c){return ids.indexOf(c.id)>-1});
  var clothes=$("rateClothes").checked;
  var btn=$("go");btn.disabled=true;btn.textContent="Madaalaa jira...";
  try{
    var b64=await new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(String(fr.result).split(",")[1])};fr.onerror=rej;fr.readAsDataURL(blob)});
    var resp=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:b64,categories:ids,clothes:clothes})});
    var raw=await resp.text();var r;
    try{r=JSON.parse(raw)}catch(_){showErr("Deebiin JSON miti (HTTP "+resp.status+"). URL: "+API_URL+" -> "+raw.slice(0,80));return}
    if(!resp.ok){showErr(r.error||("HTTP "+resp.status));return}
    if(!r||r.error){showErr(r&&r.error?r.error:"Madaallii hin argamne. Irra deebi’i.");return}
    render(r,sel);
  }catch(e){
    var c=e&&e.code;
    showErr(e instanceof TypeError?"Worker URL sirrii hin taane ykn CORS rakkoo qaba. API_URL sirreessi.":c==="not_granted"?"Eeyyamni hin kennamne.":c==="rate_limited"?"Yeroo muraasaan booda yaali.":"Rakkoon uumame. ["+(e&&e.name)+": "+(e&&e.message)+"]");
  }finally{btn.textContent="Madaali";upd()}
});

function render(r,sel){
  var h='<div class="overall"><div class="big">'+(r.overall!=null?esc(r.overall)+'/10':'—')+'</div><p>'+esc(r.summary)+'</p></div>';
  (r.categories||[]).forEach(function(c){
    var meta=CATS.filter(function(x){return x.id===c.id})[0]||{l:c.id,ic:"•"};
    var sc=c.score;
    h+='<div class="row"><div class="h"><span>'+meta.ic+' '+esc(meta.l)+'</span><span>'+(sc!=null?esc(sc)+'/10':'—')+'</span></div>'+
    '<div class="bar"><i style="width:'+(sc!=null?Math.max(0,Math.min(10,sc))*10:0)+'%"></i></div>'+
    '<p>'+esc(c.comment)+'</p>'+(c.tip?'<p>💡 '+esc(c.tip)+'</p>':'')+'</div>';
  });
  if(r.outfit_rate){
    var o=r.outfit_rate;
    h+='<div class="row"><div class="h"><span>👗 Rate uffataa</span><span>'+(o.score!=null?esc(o.score)+'/10':'—')+'</span></div>'+
    '<div class="bar"><i style="width:'+(o.score!=null?Math.max(0,Math.min(10,o.score))*10:0)+'%"></i></div><p>'+esc(o.comment)+'</p></div>';
  }
  h+='<p class="note">Kun yaada AI ti; bareedinni gatii kee hin murteessu.</p>';
  var res=$("res");res.innerHTML=h;res.classList.remove("hide");res.scrollIntoView({behavior:"smooth"});
}
})();
</script>
</body>
</html>
